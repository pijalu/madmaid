name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend and Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run build
      - run: go test ./...
      - run: go build -o /tmp/madmaid-check .

  build-binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: '' }
          - { goos: linux, goarch: arm64, suffix: '' }
          - { goos: darwin, goarch: amd64, suffix: '' }
          - { goos: darwin, goarch: arm64, suffix: '' }
          - { goos: windows, goarch: amd64, suffix: '.exe' }
          - { goos: windows, goarch: arm64, suffix: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run build
      - name: Build native executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "madmaid-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: madmaid-${{ matrix.goos }}-${{ matrix.goarch }}
          path: madmaid-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 14
