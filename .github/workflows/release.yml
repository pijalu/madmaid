name: Release executables

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: '' }
          - { goos: linux, goarch: arm64, suffix: '' }
          - { goos: darwin, goarch: amd64, suffix: '' }
          - { goos: darwin, goarch: arm64, suffix: '' }
          - { goos: windows, goarch: amd64, suffix: '.exe' }
          - { goos: windows, goarch: arm64, suffix: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run build
      - name: Build native executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o "madmaid-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: madmaid-${{ matrix.goos }}-${{ matrix.goarch }}
          path: madmaid-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: madmaid-*
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum madmaid-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Madmaid ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
